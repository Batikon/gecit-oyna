<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151c1b">
  <meta name="description" content="Geçit’te dört silah arkadaşınla savaş, merkez sancağı ele geçir ve cepheye geri dön.">
  <title>Geçit · Bayrak Savaşı</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="gecit.css?v=3ea8c493d51eb572">
  <script defer src="gecit.js?v=640253190bb6d9fb"></script>
</head>
<body>
  <main id="game" aria-label="Geçit">
    <div class="field">
      <canvas id="unity-canvas" tabindex="-1" aria-label="Geçit oyun alanı"></canvas>
    </div>
    <p class="rotate-play" id="rotate-play" hidden>Geniş görüş için telefonu yana çevir.</p>
    <section class="cover" id="cover" aria-labelledby="title">
      <div class="intro">
        <div class="title-line"><h1 id="title">Geçit</h1><span class="version">v0.4.0-alpha.4</span></div>
        <p class="objective">Sancağı ele geçir. Düştüğünde tuttuğun mevziden savaşa dön.</p>
        <button type="button" id="start">Oyuna gir</button>
        <div id="download" hidden>
          <progress id="progress" max="100" value="0" aria-label="Oyun yükleniyor"></progress>
        </div>
        <p id="status" class="notice" role="status" aria-live="polite"></p>
        <div id="alternatives" hidden>
          <a href="https://github.com/Batikon/gecit-oyna/releases">Android sürümlerini aç</a>
          <a href="./oynanis.mp4">Maç kaydını izle</a>
        </div>
        <p class="rotate-intro">Sahayı geniş görmek için telefonu yana çevir.</p>
        <noscript>Oyunu açmak için tarayıcında JavaScript’i etkinleştir.</noscript>
      </div>
    </section>
  </main>
</body>
</html>
